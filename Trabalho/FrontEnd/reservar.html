<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Move | Locadora de Veículos</title>
  </head>
  <body>
    <div class="container">
      <div>
        <h1>Move Locadora</h1>
        <nav>
            <a href="index.html">Início</a>
            <a href="veiculos.html">Lista</a>
            <a href="consultar.html">Consultar</a>
          <a href="editar.html">Editar</a>
          <a href="entrar.html">Entrar</a>
          <a href="cadastrar.html">Cadastrar</a>
        </nav>
      </div>
       <h2>Comece sua jornada conosco!</h2>
      <section class="reserva">
        <form action="veiculos.html" method="post">
          <label for="Nome">Nome do Motorista:</label>
          <input id="Nome" name="Nome" type="text" />

          <label for="Data-Retirada">Data de Retirada:</label>
          <input id="Data-Retirada" name="Data de Retirada" type="date" />

          <label for="Data-Devolucao">Data de Devolução:</label>
          <input id="Data-Devolucao" name="Data de Devolução" type="date" />

          <label for="Idade-Motorista">Idade do Motorista</label>
          <select id="Idade-Motorista" name="Idade do Motorista">
            <option value="18-25">18-25</option>
            <option value="26-35">26-35</option>
            <option value="36-45">36-45</option>
            <option value="46+">46+</option>
          </select>

          <button><a href="veiculos.html">Buscar Veículos</a></button>
        </form>
      </section>
    </div>
