<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Move | Entrar</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div>
        <h1>Move Locadora</h1>
        <nav>
          <a href="index.html">Início</a>
          <a href="listar.html">Listar</a>
          <a href="consultar.html">Consultar</a>
          <a href="editar.html">Editar/Cadastrar</a>
          <a href="entrar.html">Entrar</a>
          <a href="cadastrar.html">Cadastrar</a>
        </nav>
      </div>

      <main>
        <h1>Entrar</h1>

        <form id="formLogin">
          <label for="login">E-mail ou Usuario:</label>
          <input
            type="text"
            id="login"
            name="login"
            placeholder="seuemail@email.com ou SeuUsuario"
            required
          />

          <label for="senha">Senha:</label>
          <input
            type="password"
            id="senha"
            name="senha"
            maxlength="10"
            placeholder="Digite sua senha"
            required
          />

          <button type="submit">Entrar</button>
        </form>

        <p>
          Ainda não tem uma conta? <a href="cadastrar.html">Faça cadastro</a>
        </p>
      </main>

      <footer>© 2026 Move Locadora. Todos os direitos reservados.</footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
