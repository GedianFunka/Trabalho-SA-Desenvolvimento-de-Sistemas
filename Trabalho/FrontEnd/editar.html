<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Move | Locadora de Veículos</title>
  </head>
  <body>
    <html class="container">
      <div>
        <h1>Move Locadora</h1>
        <nav>
          <a href="index.html">Início</a>
          <a href="listar.html">Listar</a>
          <a href="consultar.html">Consultar</a>
          <a href="editar.html">Editar</a>
          <a href="entrar.html">Entrar</a>
          <a href="cadastrar.html">Cadastrar</a>
        </nav>
      </div>

      <main>
        <h1>Editar Veículo</h1>

        <form>
          <label for="model">Modelo</label>
          <input type="text" id="model" name="model" value="Toyota Corolla" />

          <label for="plate">Placa</label>
          <input type="text" id="plate" name="plate" value="XYZ-9876" />

          <label for="category">Categoria</label>
          <input type="text" id="category" name="category" value="Sedan" />

          <label for="price">Diária</label>
          <input type="text" id="price" name="price" value="R$ 180,00" />

          <label for="status">Status</label>
          <select id="status" name="status">
            <option value="available" selected>Disponível</option>
            <option value="rented">Alugado</option>
            <option value="maintenance">Manutenção</option>
          </select>

          <button type="submit">Salvar</button>
        </form>
      </main>

      <footer>© 2026 Move Locadora. Todos os direitos reservados.</footer>
    </html>
  </body>
</html>
