<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Move | Painel Admin</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div>
        <h1>Move Locadora - Painel Admin</h1>
        <nav>
          <a href="index.html">Início</a>
          <a href="listar.html">Listar</a>
          <a href="consultar.html">Consultar</a>
          <a href="editar.html">Editar/Cadastrar</a>
          <a href="entrar.html">Entrar</a>
          <a href="cadastrar.html">Cadastrar</a>
        </nav>
      </div>

      <main>
        <h2>Cadastrar Novo Veículo</h2>
        <form id="formAdicionarVeiculo">
          <label for="cadModelo">Modelo:</label>
          <input
            type="text"
            id="cadModelo"
            placeholder="Ex: Toyota Corolla"
            required
          />

          <label for="cadAno">Ano:</label>
          <input type="number" id="cadAno" placeholder="Ex: 2023" required />

          <label for="cadPlaca">Placa:</label>
          <input
            type="text"
            id="cadPlaca"
            placeholder="Ex: ABC-1234"
            required
          />

          <label for="cadPrecoDiaria">Preço da Diária:</label>
          <input
            type="number"
            step="0.01"
            id="cadPrecoDiaria"
            placeholder="Ex: 150.00"
            required
          />

          <label for="cadCondicao">Condição:</label>
          <input
            type="text"
            id="cadCondicao"
            placeholder="Ex: Disponível, Indisponível, Em manutenção"
            required
          />

          <label for="inputImagem">Imagem do Veículo:</label>
          <input type="file" id="inputImagem" accept="image/*" />

          <button type="submit">Cadastrar Veículo</button>
        </form>

        <br />
        <hr />
        <br />

        <h2>Atualizar ou Excluir Veículo Existente</h2>
        <form id="formEditar">
          <label for="id_veiculo">ID do veículo:</label>
          <input type="number" id="id_veiculo" placeholder="Ex: 1" required />

          <label for="Modelo">Modelo:</label>
          <input type="text" id="Modelo" placeholder="Ex: Toyota Corolla" />

          <label for="Ano">Ano:</label>
          <input type="number" id="Ano" placeholder="Ex: 2023" />

          <label for="Placa">Placa:</label>
          <input type="text" id="Placa" placeholder="Ex: ABC-1234" />

          <label for="Preco_Diaria">Preço da Diária:</label>
          <input type="number" step="0.01" id="Preco_Diaria" placeholder="Ex: 150.00" />

          <label for="Condicao">Condição:</label>
          <input
            type="text"
            id="Condicao"
            placeholder="Ex: Disponível, Indisponível, Em manutenção"
          />

          <label for="inputImagemEditar">Nova Imagem do Veículo (opcional):</label>
          <input type="file" id="inputImagemEditar" accept="image/*" />

          <button type="submit">Salvar Alterações</button>
          <button id="btnExcluir" type="button">Excluir Veículo</button>
        </form>
      </main>

      <footer>© 2026 Move Locadora. Painel Administrativo.</footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
