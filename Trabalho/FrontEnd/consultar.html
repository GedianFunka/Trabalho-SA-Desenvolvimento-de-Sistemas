<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Move | Consultar Veículos</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div>
        <h1>Move Locadora</h1>
        <nav>
          <a href="index.html">Início</a>
          <a href="listar.html">Listar</a>
          <a href="consultar.html">Consultar</a>
          <a href="editar.html">Editar/Cadastrar</a>
          <a href="entrar.html">Entrar</a>
          <a href="cadastrar.html">Cadastrar</a>
        </nav>
      </div>

      <main>
        <h1>Consultar Veículos</h1>

        <form id="formConsultar">
          <label for="search"
            >Pesquisar por Modelo, Placa, Ano ou Condição:</label
          >
          <input
            type="text"
            id="search"
            placeholder="Ex: Corolla, 2023, Disponível"
          />
          <button type="submit">Buscar</button>
        </form>

        <table>
          <thead>
            <tr>
              <th>Imagem</th>
              <th>Modelo</th>
              <th>Placa</th>
              <th>Ano</th>
              <th>Condição</th>
            </tr>
          </thead>
          <tbody id="resultadoConsulta"></tbody>
        </table>
      </main>

      <footer>© 2026 Move Locadora. Todos os direitos reservados.</footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
