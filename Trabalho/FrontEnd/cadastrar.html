<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Move | Cadastrar</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div>
        <h1>Move Locadora</h1>
        <nav>
          <a href="index.html">Início</a>
          <a href="listar.html">Listar</a>
          <a href="consultar.html">Consultar</a>
          <a href="editar.html">Editar/Cadastrar</a>
          <a href="entrar.html">Entrar</a>
          <a href="cadastrar.html">Cadastrar</a>
        </nav>
      </div>

      <main>
        <h1>Criar Conta</h1>

        <form id="formCadastro">
          <label for="usuario">Nome do usuario:</label>
          <input
            type="text"
            id="usuario"
            name="usuario"
            placeholder="Ex: GedianFunka"
            required
          />

          <label for="email">Email:</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Ex:gedianfunka@gmail.com"
            required
          />

          <label for="senha">Senha:</label>
          <input
            type="password"
            id="senha"
            name="senha"
            maxlength="10"
            placeholder="Ex: 0123456789"
            required
          />

          <button type="submit">Cadastrar</button>
        </form>

        <p>Já tem uma conta? <a href="entrar.html">Faça login</a></p>
      </main>

      <footer>© 2026 Move Locadora. Todos os direitos reservados.</footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
